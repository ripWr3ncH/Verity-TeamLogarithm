# ==========================================================================
#  VERITY — orderers and peers
#
#  5 ordering nodes across 5 organisations (BFT, n >= 3f+1, tolerates f = 1)
#  4 peer organisations
#
#  Whitepaper §4.1, §4.2. State database is LevelDB, not CouchDB: rich queries
#  live in the off-chain read model (services/listener -> Postgres), which is
#  the standard Fabric pattern and halves container memory.
# ==========================================================================

networks:
  verity:
    name: verity_net

volumes:
  orderer0.ord-bb.verity.bd:
  orderer1.ord-bibm.verity.bd:
  orderer2.ord-frc.verity.bd:
  orderer3.ord-seata.verity.bd:
  orderer4.ord-seatb.verity.bd:
  peer0.banka.verity.bd:
  peer0.bankb.verity.bd:
  peer0.bb.verity.bd:
  peer0.frc.verity.bd:

# ---------------------------------------------------------------------------
#  Shared fragments
# ---------------------------------------------------------------------------
x-orderer-base: &orderer-base
  image: hyperledger/fabric-orderer:${FABRIC_VERSION:-3.1}
  labels:
    service: hyperledger-fabric
    verity.role: orderer
  environment: &orderer-env
    FABRIC_LOGGING_SPEC: ${FABRIC_LOGGING_SPEC:-INFO}
    ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
    ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
    ORDERER_GENERAL_TLS_ENABLED: "true"
    ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    # BFT requires cluster credentials on every node.
    ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    # No system channel in Fabric v3 — channels are joined via osnadmin.
    ORDERER_GENERAL_BOOTSTRAPMETHOD: none
    ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
    ORDERER_ADMIN_TLS_ENABLED: "true"
    ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    ORDERER_METRICS_PROVIDER: prometheus
  working_dir: /root
  command: orderer
  networks:
    - verity

x-peer-base: &peer-base
  image: hyperledger/fabric-peer:${FABRIC_VERSION:-3.1}
  labels:
    service: hyperledger-fabric
    verity.role: peer
  environment: &peer-env
    FABRIC_LOGGING_SPEC: ${FABRIC_LOGGING_SPEC:-INFO}
    CORE_PEER_TLS_ENABLED: "true"
    CORE_PEER_PROFILE_ENABLED: "false"
    CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
    CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
    CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
    CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
    CORE_LEDGER_STATE_STATEDATABASE: goleveldb
    # No CORE_VM_ENDPOINT. Chaincode runs as a service (CCaaS), so the peer
    # never builds an image and never needs the host Docker daemon. Fabric 3.x
    # ships the builder at /opt/hyperledger/ccaas_builder.
    CORE_CHAINCODE_EXECUTETIMEOUT: 300s
    CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9440
    CORE_METRICS_PROVIDER: prometheus
    # Gateway service — used by services/api via @hyperledger/fabric-gateway
    CORE_PEER_GATEWAY_ENABLED: "true"
  working_dir: /root
  command: peer node start
  networks:
    - verity

services:

  # =========================================================================
  #  ORDERING SERVICE — 5 nodes, 5 organisations (§4.1)
  # =========================================================================

  orderer0.ord-bb.verity.bd:
    <<: *orderer-base
    container_name: orderer0.ord-bb.verity.bd
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererBBMSP
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:8050
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:8450
    ports: ["7050:7050", "8050:8050", "8450:8450"]
    volumes:
      - ../organizations/ordererOrganizations/ord-bb.verity.bd/orderers/orderer0.ord-bb.verity.bd/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/ord-bb.verity.bd/orderers/orderer0.ord-bb.verity.bd/tls:/var/hyperledger/orderer/tls
      - orderer0.ord-bb.verity.bd:/var/hyperledger/production/orderer

  orderer1.ord-bibm.verity.bd:
    <<: *orderer-base
    container_name: orderer1.ord-bibm.verity.bd
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7051
      ORDERER_GENERAL_LOCALMSPID: OrdererBIBMMSP
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:8051
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:8451
    ports: ["7051:7051", "8051:8051", "8451:8451"]
    volumes:
      - ../organizations/ordererOrganizations/ord-bibm.verity.bd/orderers/orderer1.ord-bibm.verity.bd/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/ord-bibm.verity.bd/orderers/orderer1.ord-bibm.verity.bd/tls:/var/hyperledger/orderer/tls
      - orderer1.ord-bibm.verity.bd:/var/hyperledger/production/orderer

  orderer2.ord-frc.verity.bd:
    <<: *orderer-base
    container_name: orderer2.ord-frc.verity.bd
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7052
      ORDERER_GENERAL_LOCALMSPID: OrdererFRCMSP
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:8052
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:8452
    ports: ["7052:7052", "8052:8052", "8452:8452"]
    volumes:
      - ../organizations/ordererOrganizations/ord-frc.verity.bd/orderers/orderer2.ord-frc.verity.bd/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/ord-frc.verity.bd/orderers/orderer2.ord-frc.verity.bd/tls:/var/hyperledger/orderer/tls
      - orderer2.ord-frc.verity.bd:/var/hyperledger/production/orderer

  orderer3.ord-seata.verity.bd:
    <<: *orderer-base
    container_name: orderer3.ord-seata.verity.bd
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7053
      ORDERER_GENERAL_LOCALMSPID: OrdererSeatAMSP
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:8053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:8453
    ports: ["7053:7053", "8053:8053", "8453:8453"]
    volumes:
      - ../organizations/ordererOrganizations/ord-seata.verity.bd/orderers/orderer3.ord-seata.verity.bd/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/ord-seata.verity.bd/orderers/orderer3.ord-seata.verity.bd/tls:/var/hyperledger/orderer/tls
      - orderer3.ord-seata.verity.bd:/var/hyperledger/production/orderer

  orderer4.ord-seatb.verity.bd:
    <<: *orderer-base
    container_name: orderer4.ord-seatb.verity.bd
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7054
      ORDERER_GENERAL_LOCALMSPID: OrdererSeatBMSP
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:8054
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:8454
    ports: ["7054:7054", "8054:8054", "8454:8454"]
    volumes:
      - ../organizations/ordererOrganizations/ord-seatb.verity.bd/orderers/orderer4.ord-seatb.verity.bd/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/ord-seatb.verity.bd/orderers/orderer4.ord-seatb.verity.bd/tls:/var/hyperledger/orderer/tls
      - orderer4.ord-seatb.verity.bd:/var/hyperledger/production/orderer

  # =========================================================================
  #  PEERS — 4 organisations (§4.2)
  # =========================================================================

  # Sammilito Islami Bank PLC — originating institution
  peer0.banka.verity.bd:
    <<: *peer-base
    container_name: peer0.banka.verity.bd
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.banka.verity.bd
      CORE_PEER_ADDRESS: peer0.banka.verity.bd:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.banka.verity.bd:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.banka.verity.bd:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.banka.verity.bd:9051
      CORE_PEER_LOCALMSPID: BankAMSP
    ports: ["9051:9051", "9451:9440"]
    volumes:
      - ../organizations/peerOrganizations/banka.verity.bd/peers/peer0.banka.verity.bd/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/banka.verity.bd/peers/peer0.banka.verity.bd/tls:/etc/hyperledger/fabric/tls
      - peer0.banka.verity.bd:/var/hyperledger/production

  # Meghna Bank — second institution
  peer0.bankb.verity.bd:
    <<: *peer-base
    container_name: peer0.bankb.verity.bd
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.bankb.verity.bd
      CORE_PEER_ADDRESS: peer0.bankb.verity.bd:9061
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9061
      CORE_PEER_CHAINCODEADDRESS: peer0.bankb.verity.bd:9062
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9062
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.bankb.verity.bd:9061
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.bankb.verity.bd:9061
      CORE_PEER_LOCALMSPID: BankBMSP
    ports: ["9061:9061", "9461:9440"]
    volumes:
      - ../organizations/peerOrganizations/bankb.verity.bd/peers/peer0.bankb.verity.bd/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/bankb.verity.bd/peers/peer0.bankb.verity.bd/tls:/etc/hyperledger/fabric/tls
      - peer0.bankb.verity.bd:/var/hyperledger/production

  # Bangladesh Bank — the supervisor. Endorses every lifecycle event (§3.8).
  peer0.bb.verity.bd:
    <<: *peer-base
    container_name: peer0.bb.verity.bd
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.bb.verity.bd
      CORE_PEER_ADDRESS: peer0.bb.verity.bd:9071
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9071
      CORE_PEER_CHAINCODEADDRESS: peer0.bb.verity.bd:9072
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9072
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.bb.verity.bd:9071
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.bb.verity.bd:9071
      CORE_PEER_LOCALMSPID: BangladeshBankMSP
    ports: ["9071:9071", "9471:9440"]
    volumes:
      - ../organizations/peerOrganizations/bb.verity.bd/peers/peer0.bb.verity.bd/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/bb.verity.bd/peers/peer0.bb.verity.bd/tls:/etc/hyperledger/fabric/tls
      - peer0.bb.verity.bd:/var/hyperledger/production

  # Financial Reporting Council — query peer. Read all, borrower identity never.
  peer0.frc.verity.bd:
    <<: *peer-base
    container_name: peer0.frc.verity.bd
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.frc.verity.bd
      CORE_PEER_ADDRESS: peer0.frc.verity.bd:9081
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9081
      CORE_PEER_CHAINCODEADDRESS: peer0.frc.verity.bd:9082
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9082
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.frc.verity.bd:9081
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.frc.verity.bd:9081
      CORE_PEER_LOCALMSPID: FRCMSP
    ports: ["9081:9081", "9481:9440"]
    volumes:
      - ../organizations/peerOrganizations/frc.verity.bd/peers/peer0.frc.verity.bd/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/frc.verity.bd/peers/peer0.frc.verity.bd/tls:/etc/hyperledger/fabric/tls
      - peer0.frc.verity.bd:/var/hyperledger/production

  # =========================================================================
  #  CLI — peer binaries for channel joins and chaincode lifecycle
  # =========================================================================
  cli:
    container_name: verity-cli
    image: hyperledger/fabric-tools:${TOOLS_VERSION:-2.5}   # fabric-tools publishes no 3.x tag
    labels:
      service: hyperledger-fabric
      verity.role: cli
    tty: true
    stdin_open: true
    environment:
      GOPATH: /opt/gopath
      FABRIC_LOGGING_SPEC: ${FABRIC_LOGGING_SPEC:-INFO}
      FABRIC_CFG_PATH: /etc/hyperledger/fabric
      CORE_PEER_TLS_ENABLED: "true"
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - ../organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ../channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts
      - ../../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
    depends_on:
      - peer0.banka.verity.bd
      - peer0.bankb.verity.bd
      - peer0.bb.verity.bd
      - peer0.frc.verity.bd
    networks:
      - verity
